<!DOCTYPE html>
<html>
<head>
    <title>Mini CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Client Lead Management System</h1>

    <input type="text" id="name" placeholder="Client Name"><br><br>

    <input type="email" id="email" placeholder="Client Email"><br><br>

    <select id="status">
        <option>New</option>
        <option>Contacted</option>
        <option>Converted</option>
    </select><br><br>

    <button onclick="addLead()">Add Lead</button>

    <h2>Lead List</h2>

    <table border="1" id="leadTable">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
        </tr>
    </table>

    <script src="script.js"></script>

</body>
</html>
